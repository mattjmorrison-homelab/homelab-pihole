apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-local-dns.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: pihole
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: TZ
              value: "America/Chicago"
            - name: FTLCONF_webserver_api_password
              value: ""
            - name: FTLCONF_webserver_port
              value: "8080"
            - name: PIHOLE_DNS_1
              value: "1.1.1.1"
            - name: PIHOLE_DNS_2
              value: "8.8.8.8"
            - name: FTLCONF_misc_etc_dnsmasq_d
              value: "true"
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: pihole-config
              mountPath: /etc/pihole
              subPath: pihole
            - name: pihole-config
              mountPath: /etc/dnsmasq.d
              subPath: dnsmasq.d
            - name: local-dns
              mountPath: /etc/dnsmasq.d/05-local-dns.conf
              subPath: 05-local-dns.conf
      volumes:
        - name: pihole-config
          persistentVolumeClaim:
            claimName: pihole-config
        - name: local-dns
          configMap:
            name: pihole-local-dns
